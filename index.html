<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login - SET Voting Software</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/index_style.css">
</head>

<body style="visibility: hidden;">
  <a href="admin.html" id="adminLoginBtn" style="position: absolute; top: 15px; right: 20px; color: var(--text-secondary); font-size: 0.8rem; text-decoration: none; opacity: 0.5; font-family: 'Outfit', sans-serif; transition: opacity 0.3s ease;">Admin</a>
  <div class="login-container glass-panel">
    <div class="logo-row">
      <img src="assets/images/set_logo.jpg" alt="School of Engineering Students' Union Logo" class="school-logo">
    </div>
    <h2 class="text-gradient">Hello Student, 👋</h2>
    <form id="loginForm">
      <input type="text" id="idNumber"
        placeholder="Enter Your ID (e.g., CSC/22/01/0001, INT/22/01/0001, LEC/22/01/0001)" required>
      <input type="submit" value="Login">
    </form>
  </div>

  <script type="module" src="js/login.js" defer></script>
</body>

</html>
