<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Link Used - SET Voting Software</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/index_style.css">
  <style>
    .message-container {
      text-align: center;
      padding: 40px 20px;
    }
    .message-container h2 {
      margin-bottom: 20px;
    }
    .message-container p {
      color: #666;
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <div class="login-container glass-panel message-container">
    <div class="logo-row">
      <img src="assets/images/set_logo.jpg" alt="School of Engineering Students' Union Logo" class="school-logo">
      <img src="assets/images/electoral-commision.jpg" alt="SET Electoral Commission Logo" class="login-logo">
    </div>
    <h2 class="text-gradient">Link Already Used</h2>
    <p>This voting link has already been used and cannot be accessed again.</p>
    <p>Thank you for participating in the election.</p>
  </div>
  <script>
    // Prevent the user from using the back button
    window.history.pushState(null, "", window.location.href);
    window.onpopstate = function () {
      window.history.pushState(null, "", window.location.href);
    };
  </script>
</body>

</html>
