<!DOCTYPE html>
<html lang="en">
<head>

  <title>Vote - Electoral Commission</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/voting_style.css">
</head>
<body>
  <div class="voting-container glass-panel">
